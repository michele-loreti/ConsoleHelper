# Messages printed by ConsoleHelper (default language: English).
#
# To add a language, copy this file as messages_xx.properties, where xx is the
# language code (e.g. messages_fr.properties), and translate the values.
# The files are read as UTF-8. Values are MessageFormat patterns: {0}, {1}
# are replaced by the arguments, and an apostrophe must be written twice ('').

error.notAnInteger=Error: please enter an integer number.
error.notANumber=Error: please enter a number.
error.emptyAnswer=Error: the answer cannot be empty.
error.notYesNo=Error: please answer yes (y) or no (n).
error.notAChar=Error: please enter exactly one character.
error.outOfRange=Error: the number must be between {0} and {1}.
error.endOfInput=End of input reached.
error.emptyInterval=min ({0}) is greater than max ({1}).
error.boundsOutOfType=min ({0}) and max ({1}) must be between {2} and {3}.
error.noOptions=At least one option is required.
error.negativeLength=The number of elements cannot be negative: {0}.

prompt.choice=Choice: 
prompt.pressEnter=Press Enter to continue...
